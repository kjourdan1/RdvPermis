name: Debug Pi (diagnostics)

on:
  push:
    branches: [debug-pi-ssh]

jobs:
  diag:
    runs-on: [self-hosted, rdvpermis]
    steps:
      - name: Who am I / sudo capability
        run: |
          echo "== user"; id; hostname; uptime
          echo "== sudo -n test"; sudo -n true 2>&1 && echo "PASSWORDLESS_SUDO=yes" || echo "PASSWORDLESS_SUDO=no"

      - name: SSH service state
        run: |
          echo "== ssh units"
          systemctl status ssh 2>&1 | head -20 || true
          systemctl status sshd 2>&1 | head -20 || true
          echo "== is-enabled"; systemctl is-enabled ssh sshd 2>&1 || true
          echo "== listening sockets"; ss -tlnp 2>/dev/null | grep -E ':22|:80|:443' || echo "nothing on 22/80/443"

      - name: Boot errors (filtered)
        run: |
          echo "== failed units"; systemctl --failed --no-legend 2>&1 || true
          echo "== journal errors this boot (ssh/mount/lvm/fstab/disk only)"
          sudo -n journalctl -b -p err --no-pager 2>/dev/null | grep -iE 'ssh|mount|lvm|fstab|fsck|ext4|disk|sda|sdb|sdc|degraded|dependency' | tail -40 || journalctl -b -p err --no-pager 2>&1 | grep -iE 'ssh|mount|lvm|fstab|fsck|ext4|disk|degraded' | tail -40 || true

      - name: Storage layout
        run: |
          echo "== lsblk"; lsblk -f 2>&1 || true
          echo "== mounts (storage)"; mount | grep -E '/mnt|storage|mergerfs' || echo "no /mnt mounts"
          echo "== fstab"; sudo -n cat /etc/fstab 2>/dev/null || cat /etc/fstab 2>&1 || true
          echo "== lvm"; sudo -n vgs 2>&1; sudo -n lvs 2>&1; sudo -n pvs 2>&1 || true

