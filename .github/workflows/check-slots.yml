name: Check RdvPermis slots

on:
  schedule:
    # Peak windows (8h-9h, 11h-14h, 16h-18h Paris time), every 5 min. GitHub
    # Actions cron is always UTC with no DST awareness, so these hours are
    # hardcoded for CEST (UTC+2, currently in effect). When Paris switches to
    # CET (UTC+1) at the end of DST -- last Sunday of October -- every hour
    # below needs +1; switching back to CEST in late March needs -1. The
    # worker's own PEAK_WINDOWS check (worker/src/schedule.ts) evaluates
    # Europe/Paris live and doesn't have this problem -- only this raw cron
    # trigger does.
    - cron: '*/5 6,9-11,14-15 * * *'
    # All other hours: every 15 min instead of every 5, to keep overall
    # request volume down. Only 4 departements are checked per run now (see
    # worker/src/config.ts), so this cadence keeps the requests-per-hour
    # against the account at or under the previous, already-proven-safe rate.
    - cron: '*/15 0-5,7-8,12-13,16-23 * * *'
  workflow_dispatch: {}

jobs:
  check:
    # Must run on the Pi: this is the only place with the residential IP and
    # the real GPU device the login-container needs to render Chromium
    # without a CDP/software-rendering signature Turnstile can catch.
    runs-on: [self-hosted, rdvpermis]
    steps:
      - uses: actions/checkout@v4

      - name: Build login container image
        working-directory: worker/login-container
        run: docker build -t rdvpermis-login .

      - name: Log in and extract a fresh session cookie
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          IONOS_IMAP_PASSWORD: ${{ secrets.IONOS_IMAP_PASSWORD }}
        run: |
          rm -rf /tmp/rdvpermis-output
          mkdir -p /tmp/rdvpermis-output
          # Fixed name (rather than Docker's default random one each run) so
          # this container is trackable as a single consistent series in
          # Grafana/cAdvisor instead of a new, unrelated-looking name every
          # time. --rm normally cleans it up on exit, but a forcibly-killed
          # run (job cancellation, runner crash) can leave it behind, so
          # clear any stale leftover first rather than let a fixed name
          # collide and hard-fail the next run.
          docker rm -f rdvpermis-login 2>/dev/null || true
          docker run --rm --name rdvpermis-login --device /dev/dri:/dev/dri \
            --cpus="2" --memory="2g" \
            -e EMAIL -e PASSWORD -e IONOS_IMAP_PASSWORD \
            -v /tmp/rdvpermis-output:/output \
            rdvpermis-login

      - name: Upload login diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: login-diagnostics-${{ github.run_id }}
          path: /tmp/rdvpermis-output/*.png
          retention-days: 7

      - name: Export cookie header for later steps
        run: |
          COOKIE=$(cat /tmp/rdvpermis-output/cookie.txt)
          echo "::add-mask::$COOKIE"
          echo "COOKIE_HEADER=$COOKIE" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Run slot check
        working-directory: worker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: npm run run
